services:
  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${FOLO_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://folo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/folo
      HOST: 0.0.0.0
      NODE_ENV: production
      UPLOADS_DIRECTORY: /data/uploads
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${FOLO_BIND_ADDRESS:-127.0.0.1}:${FOLO_PORT:-3000}:3000"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - folo-uploads:/data/uploads
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: folo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: folo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folo -d folo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    stop_grace_period: 60s
    volumes:
      - folo-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m

volumes:
  folo-postgres:
  folo-uploads:
