services:
  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${FOLO_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://folo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/folo
      HOST: 0.0.0.0
      NODE_ENV: production
      UPLOADS_DIRECTORY: /data/uploads
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${FOLO_BIND_ADDRESS:-127.0.0.1}:${FOLO_PORT:-3000}:3000"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - folo-uploads:/data/uploads
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - core

  feed-supplier:
    profiles: ["sources"]
    build:
      context: ../..
      dockerfile: apps/feed-supplier/Dockerfile
    depends_on:
      feed-supplier-postgres:
        condition: service_healthy
      rsshub:
        condition: service_healthy
    environment:
      ADMIN_TOKEN: ${FEED_SUPPLIER_ADMIN_TOKEN:?set FEED_SUPPLIER_ADMIN_TOKEN}
      AUDIT_HMAC_KEY: ${FEED_SUPPLIER_AUDIT_HMAC_KEY:?set FEED_SUPPLIER_AUDIT_HMAC_KEY}
      CREDENTIAL_DECRYPTION_KEYS_JSON: ${FEED_SUPPLIER_CREDENTIAL_DECRYPTION_KEYS_JSON:-{}}
      CREDENTIAL_ENCRYPTION_KEY: ${FEED_SUPPLIER_CREDENTIAL_ENCRYPTION_KEY:?set FEED_SUPPLIER_CREDENTIAL_ENCRYPTION_KEY}
      CREDENTIAL_ENCRYPTION_KEY_ID: ${FEED_SUPPLIER_CREDENTIAL_ENCRYPTION_KEY_ID:?set FEED_SUPPLIER_CREDENTIAL_ENCRYPTION_KEY_ID}
      DATABASE_URL: ${FEED_SUPPLIER_DATABASE_URL:?set FEED_SUPPLIER_DATABASE_URL}
      HOST: 0.0.0.0
      INTERNAL_TOKEN: ${FEED_SUPPLIER_TOKEN:?set FEED_SUPPLIER_TOKEN}
      NODE_ENV: production
      PAGE_CONTENT_MAX_BYTES: ${PAGE_CONTENT_MAX_BYTES:-262144}
      PAGE_FETCH_MAX_BYTES: ${PAGE_FETCH_MAX_BYTES:-5242880}
      PAGE_FETCH_TIMEOUT_MS: ${PAGE_FETCH_TIMEOUT_MS:-15000}
      PAGE_SCHEDULER_POLL_INTERVAL_MS: ${PAGE_SCHEDULER_POLL_INTERVAL_MS:-60000}
      ROUTE_REGISTRY_MODE: ${FEED_SUPPLIER_REGISTRY_MODE:-permissive}
      RSSHUB_ACCESS_KEY: ${RSSHUB_ACCESS_KEY:?set RSSHUB_ACCESS_KEY}
      RSSHUB_BASE_URL: http://rsshub:1200
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - core
      - sources

  feed-supplier-postgres:
    profiles: ["sources"]
    image: postgres:17
    environment:
      POSTGRES_DB: feed_supplier
      POSTGRES_PASSWORD: ${FEED_SUPPLIER_POSTGRES_PASSWORD:?set FEED_SUPPLIER_POSTGRES_PASSWORD}
      POSTGRES_USER: feed_supplier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed_supplier -d feed_supplier"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    stop_grace_period: 60s
    volumes:
      - feed-supplier-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - sources

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: folo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: folo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folo -d folo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    stop_grace_period: 60s
    volumes:
      - folo-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - core

  rsshub:
    profiles: ["sources"]
    image: ${RSSHUB_IMAGE:-diygod/rsshub:latest}
    environment:
      ACCESS_KEY: ${RSSHUB_ACCESS_KEY:?set RSSHUB_ACCESS_KEY}
      CACHE_TYPE: memory
      NODE_ENV: production
      NO_LOGFILES: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1200/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - sources

networks:
  core:
  sources:

volumes:
  feed-supplier-postgres:
  folo-postgres:
  folo-uploads:
