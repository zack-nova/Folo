services:
  api:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://folo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/folo
      HOST: 0.0.0.0
      UPLOADS_DIRECTORY: /data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - folo-uploads:/data/uploads

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: folo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: folo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folo -d folo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - folo-postgres:/var/lib/postgresql/data

volumes:
  folo-postgres:
  folo-uploads:
