services:
  feed-supplier:
    profiles: ["sources"]
    build:
      context: ../..
      dockerfile: apps/feed-supplier/Dockerfile
    depends_on:
      feed-supplier-postgres:
        condition: service_healthy
      rsshub:
        condition: service_healthy
    environment:
      ADMIN_TOKEN: local-feed-supplier-admin-token-at-least-32-characters
      AUDIT_HMAC_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=
      CREDENTIAL_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      CREDENTIAL_ENCRYPTION_KEY_ID: local-primary
      DATABASE_URL: postgresql://feed_supplier:feed_supplier@feed-supplier-postgres:5432/feed_supplier
      HOST: 0.0.0.0
      INTERNAL_TOKEN: local-feed-supplier-token-at-least-32-characters
      NODE_ENV: development
      ROUTE_REGISTRY_MODE: permissive
      RSSHUB_BASE_URL: http://rsshub:1200
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:3001:3001"

  feed-supplier-postgres:
    profiles: ["sources"]
    image: postgres:17
    environment:
      POSTGRES_DB: feed_supplier
      POSTGRES_PASSWORD: feed_supplier
      POSTGRES_USER: feed_supplier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed_supplier -d feed_supplier"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - feed-supplier-postgres:/var/lib/postgresql/data

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: folo
      POSTGRES_PASSWORD: folo
      POSTGRES_USER: folo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folo -d folo"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "54329:5432"
    volumes:
      - folo-postgres:/var/lib/postgresql/data

  rsshub:
    profiles: ["sources"]
    image: ${RSSHUB_IMAGE:-diygod/rsshub:latest}
    environment:
      CACHE_TYPE: memory
      NODE_ENV: production
      NO_LOGFILES: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1200/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  feed-supplier-postgres:
  folo-postgres:
